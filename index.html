<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color-Code Decoding Game</title>

<style>
:root {
  --bg: #f7f7fb;
  --panel: #ffffff;
  --ink: #1f2937;
  --muted: #6b7280;
  --line: #d1d5db;
  --tri: #e5e7eb;
  --tri-on: #93c5fd;
  --tri-mark: #fde047;
  --red: #ef4444;
  --blue: #2563eb;
  --green: #16a34a;
}

body {
  margin: 0;
  display: flex;
  font-family: system-ui;
  background: var(--bg);
}

aside {
  width: 280px;
  padding: 20px;
  background: white;
  border-right: 1px solid var(--line);
}

main { flex: 1; }

svg {
  display: block;
  margin: 10px auto;
  background: white;
  border: 1px solid var(--line);
  border-radius: 12px;
}

polygon.triangle {
  fill: var(--tri);
  stroke: #9ca3af;
  cursor: pointer;
}

/* yellow mark */
polygon.triangle.marked {
  fill: var(--tri-mark);
}

/* blue ON should override yellow */
polygon.triangle.on {
  fill: var(--tri-on);
}

circle.target { stroke: var(--red); fill: none; stroke-width: 3; }
circle.produced { stroke: var(--blue); fill: none; stroke-dasharray: 3 3; }

</style>
</head>

<body>

<aside>
<h2>Decoder</h2>

<label>Grid size</label>
<select id="sizeSelect">
<option value="4">4</option>
<option value="5">5</option>
<option value="6">6</option>
<option value="7">7</option>
<option value="8">8</option>
<option value="9">9</option>
<option value="10">10</option>
<option value="11">11</option>
<option value="12">12</option>
<option value="13">13</option>
<option value="14">14</option>
<option value="15">15</option>
</select>

<button id="resetBtn">Reset</button>

</aside>

<main>
<svg id="board"></svg>
</main>

<script>
const svg = document.getElementById("board");
const sizeSelect = document.getElementById("sizeSelect");

let state = {
  n: 6,
  vertices: [],
  triangles: [],
  chosen: new Set(),
  marked: new Set(),
  target: new Set(),
  produced: new Set()
};

function key(i,j){ return i+","+j; }

function makeBoard(n){
  const step = Math.max(28, Math.min(80, 600/n));
  const h = step * Math.sqrt(3)/2;

  svg.setAttribute("width", 800);
  svg.setAttribute("height", 700);

  let verts = [];
  let map = new Map();

  for(let j=0;j<=n;j++){
    for(let i=0;i<=n;i++){
      const x = 40 + step*(i + j*0.5);
      const y = 40 + h*j;
      const id = key(i,j);
      const v = {id,x,y};
      verts.push(v);
      map.set(id,v);
    }
  }

  let tris=[];
  let t=0;
  for(let j=0;j<n;j++){
    for(let i=0;i<n;i++){
      const a=key(i,j), b=key(i+1,j), c=key(i,j+1), d=key(i+1,j+1);
      tris.push({id:"t"+t++, verts:[a,b,c]});
      tris.push({id:"t"+t++, verts:[b,d,c]});
    }
  }

  state.vertices=verts;
  state.vertexMap=map;
  state.triangles=tris;
  state.chosen.clear();
  state.marked.clear();
}

function poly(tri){
  return tri.verts.map(id=>{
    let v=state.vertexMap.get(id);
    return v.x+","+v.y;
  }).join(" ");
}

function syndrome(set){
  let s=new Set();
  for(let tid of set){
    let tri=state.triangles.find(t=>t.id===tid);
    for(let v of tri.verts){
      if(s.has(v)) s.delete(v); else s.add(v);
    }
  }
  return s;
}

function render(){
  svg.innerHTML="";

  for(let tri of state.triangles){
    let p=document.createElementNS("http://www.w3.org/2000/svg","polygon");
    p.setAttribute("points",poly(tri));

    let cls="triangle";
    if(state.marked.has(tri.id)) cls+=" marked";
    if(state.chosen.has(tri.id)) cls+=" on"; // applied last → blue wins
    p.setAttribute("class",cls);

    p.onclick=()=>{
      if(state.chosen.has(tri.id)) state.chosen.delete(tri.id);
      else state.chosen.add(tri.id);
      state.produced=syndrome(state.chosen);
      render();
    };

    p.oncontextmenu=(e)=>{
      e.preventDefault();
      if(state.marked.has(tri.id)) state.marked.delete(tri.id);
      else state.marked.add(tri.id);
      render();
    };

    svg.appendChild(p);
  }

  for(let v of state.target){
    let vv=state.vertexMap.get(v);
    let c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",vv.x);
    c.setAttribute("cy",vv.y);
    c.setAttribute("r",10);
    c.setAttribute("class","target");
    svg.appendChild(c);
  }

  for(let v of state.produced){
    let vv=state.vertexMap.get(v);
    let c=document.createElementNS("http://www.w3.org/2000/svg","circle");
    c.setAttribute("cx",vv.x);
    c.setAttribute("cy",vv.y);
    c.setAttribute("r",14);
    c.setAttribute("class","produced");
    svg.appendChild(c);
  }
}

function random(){
  state.chosen.clear();
  state.marked.clear();

  let hidden=new Set();
  let k=Math.floor(state.n*2);
  while(hidden.size<k){
    let t=state.triangles[Math.floor(Math.random()*state.triangles.length)];
    hidden.add(t.id);
  }

  state.target=syndrome(hidden);
  state.produced=new Set();
  render();
}

function reset(){
  state.n=Number(sizeSelect.value);
  makeBoard(state.n);
  random();
}

document.getElementById("resetBtn").onclick=random;
sizeSelect.onchange=reset;

reset();
</script>

</body>
</html>
