<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Color-Code Decoding Game</title>

<style>
:root {
  --tri: #e5e7eb;
  --tri-on: #93c5fd;
  --tri-mark: #fde047; /* yellow mark */
}

/* existing styles unchanged ... */

polygon.triangle {
  fill: var(--tri);
  stroke: #9ca3af;
  stroke-width: 1.1;
  cursor: pointer;
}

polygon.triangle.on {
  fill: var(--tri-on);
}

polygon.triangle.marked {
  fill: var(--tri-mark);
}
</style>
</head>

<body>

<select id="sizeSelect">
  <option value="4" selected>4</option>
  <option value="5">5</option>
  <option value="6">6</option>
  <option value="7">7</option>
  <option value="8">8</option>
  <option value="9">9</option>
  <option value="10">10</option>
  <option value="11">11</option>
  <option value="12">12</option>
  <option value="13">13</option>
  <option value="14">14</option>
  <option value="15">15</option>
</select>

<svg id="board"></svg>

<script>
const svg = document.getElementById('board');
const sizeSelect = document.getElementById('sizeSelect');

let state = {
  n: 5,
  triangles: [],
  chosen: new Set(),
  marked: new Set() // NEW
};

function key(i,j){ return `${i},${j}`; }

function makeBoard(n){
  const step = Math.max(28, Math.min(82, 560 / n)); // improved scaling
  const h = step * Math.sqrt(3) / 2;

  svg.setAttribute("width", 900);
  svg.setAttribute("height", 700);

  let triangles = [];
  let tid = 0;

  for (let j = 0; j < n; j++){
    for (let i = 0; i < n; i++){
      triangles.push({ id: `t${tid++}`, verts: [[i,j],[i+1,j],[i,j+1]] });
      triangles.push({ id: `t${tid++}`, verts: [[i+1,j],[i+1,j+1],[i,j+1]] });
    }
  }

  state.triangles = triangles;
  state.chosen.clear();
  state.marked.clear();
}

function polygonPoints(tri){
  const step = Math.max(28, Math.min(82, 560 / state.n));
  const h = step * Math.sqrt(3)/2;
  const margin = 40;

  return tri.verts.map(([i,j])=>{
    const x = margin + step*(i + 0.5*j);
    const y = margin + h*j;
    return `${x},${y}`;
  }).join(" ");
}

function clearSvg(){
  while(svg.firstChild) svg.removeChild(svg.firstChild);
}

function render(){
  clearSvg();

  for (const tri of state.triangles){
    const p = document.createElementNS("http://www.w3.org/2000/svg","polygon");

    p.setAttribute("points", polygonPoints(tri));

    let cls = "triangle";
    if (state.marked.has(tri.id)) cls += " marked";
    else if (state.chosen.has(tri.id)) cls += " on";

    p.setAttribute("class", cls);

    // LEFT CLICK (normal toggle)
    p.addEventListener("click", ()=>{
      if (state.chosen.has(tri.id)) state.chosen.delete(tri.id);
      else state.chosen.add(tri.id);
      render();
    });

    // RIGHT CLICK (mark toggle)
    p.addEventListener("contextmenu", (e)=>{
      e.preventDefault();
      if (state.marked.has(tri.id)) state.marked.delete(tri.id);
      else state.marked.add(tri.id);
      render();
    });

    svg.appendChild(p);
  }
}

function reset(){
  state.n = Number(sizeSelect.value);
  makeBoard(state.n);
  render();
}

sizeSelect.addEventListener("change", reset);

reset();
</script>

</body>
</html>
